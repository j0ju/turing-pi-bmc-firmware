image tp2-bmc-sdonly.img {
	hdimage {
		partition-table-type = "hybrid"
		gpt-location = 992K
		gpt-no-backup = true
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		# This offset cannot change:
		offset = 8K
	}

	partition rootfs {
		partition-type = "0x83"
		partition-type-uuid = "L"
		bootable = true
		image = "rootfs.erofs"
    size = 512M
	}
}
